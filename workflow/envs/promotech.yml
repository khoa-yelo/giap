# Promotech (GPL-3.0) frozen env, §7.1.1: Python 3.6.10, TensorFlow 2.1.0, scikit-learn 0.23.1.
# Source cloned at commit 56251ad9b883ef831b4753fc623d5ec970fe65e0 (ADR-0008) into
# $CONDA_PREFIX/share/promotech. TensorFlow 2.1.0 is not on conda-forge, so it comes from its PyPI
# cp36 wheel (§17 fallback); versions of the other packages follow upstream promotech_env.yml.
name: giap-promotech
channels: [conda-forge, bioconda]
dependencies:
  - python=3.6.10
  - pip=21.3.1
  - numpy=1.19.1
  - scipy=1.4.1
  - scikit-learn=0.23.1
  - pandas=1.1.5
  - biopython=1.77
  - h5py=2.10.0
  - joblib=0.16.0
  - matplotlib-base=3.2.2
  - openpyxl=3.0.4
  - xlsxwriter=1.2.9
  - scikit-bio=0.5.6
  - bedtools=2.29.2
  - pybedtools=0.8.1
  - pip:
    - tensorflow==2.1.0
    - protobuf==3.19.6
    - progressbar2==3.37.1
