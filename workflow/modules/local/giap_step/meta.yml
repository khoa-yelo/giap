name: giap_step
description: Run one GIAP Python pipeline step through `giap _step` (GIAP_SPEC.md §6.2, §6.3).
keywords: [giap, step]
tools:
  - giap:
      description: Genome-integrated annotation of proteomics (this package).
      licence: ["MIT"]
input:
  - - step:
        type: string
        description: Registry step name (the process tag).
    - inputs:
        type: file
        description: Input files, staged under in/, one per entry of in_keys.
  - in_keys:
      type: list
      description: Step input keys, aligned with inputs (a repeated key collects a list).
  - out_spec:
      type: list
      description: Output items "key=file name", passed as --out.
output:
  - outputs:
      - step:
          type: string
          description: Registry step name.
      - files:
          type: file
          description: The files named in out_spec.
  - versions:
      - versions.yml:
          type: file
          description: Software versions (nf-core style).
