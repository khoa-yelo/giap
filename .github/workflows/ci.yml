# Fast checks on every push and pull request (GIAP_SPEC.md §12). Heavy suites run on FarmShare.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src/giap
      - run: uv run --no-sync python scripts/ci/check_imports.py src
      - run: uv run --no-sync python scripts/write_config_schema.py --check

  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin ${{ github.base_ref }}
      - name: protected files (R3)
        run: python3 scripts/ci/check_protected.py origin/${{ github.base_ref }}
      - name: test/implementation roles (R2)
        run: python3 scripts/ci/check_roles.py origin/${{ github.base_ref }}
      - name: PR size (code only, ADR-0007, ADR-0016)
        run: |
          # Only code counts toward the gate; tests (incl. workflow/tests, ADR-0016), docs, specs, ADRs,
          # locks and fixtures are reported.
          lines=$(git diff --numstat origin/${{ github.base_ref }}...HEAD -- src workflow scripts \
                  ':!workflow/tests' | awk '{s+=$1+$2} END {print s+0}')
          other=$(git diff --numstat origin/${{ github.base_ref }}...HEAD -- . ':!src' ':!workflow' ':!scripts' \
                  | awk '{s+=$1+$2} END {print s+0}')
          nftests=$(git diff --numstat origin/${{ github.base_ref }}...HEAD -- workflow/tests \
                  | awk '{s+=$1+$2} END {print s+0}')
          other=$((other + nftests))
          warn=$(awk '/^pr_lines_warn:/ {print $2}' ci/gates.yaml)
          fail=$(awk '/^pr_lines_fail:/ {print $2}' ci/gates.yaml)
          echo "changed code lines: $lines (warn $warn, fail $fail); other lines (not gated): $other"
          if [ "$lines" -gt "$fail" ]; then echo "::error::PR too large ($lines > $fail)"; exit 1; fi
          if [ "$lines" -gt "$warn" ]; then echo "::warning::PR above $warn lines ($lines)"; fi

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}   # overrides .python-version, so uv never rebuilds the venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - name: unit, property, golden, contract, snapshot
        # whole tests/ tree minus the slow layers; empty layer directories are not tracked by git
        run: >
          uv run --no-sync pytest -n auto -m "not slow and not calibration and not calibration_full and not e2e"
          tests --ignore=tests/calibration --ignore=tests/integration --ignore=tests/e2e
          --junitxml=junit.xml

  calibration-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - name: fast calibration subset
        run: |
          set +e
          uv run --no-sync pytest -n auto -m "calibration and not calibration_full" tests/calibration
          code=$?
          # exit code 5 = no tests collected (allowed until the first calibration suite exists)
          if [ $code -ne 0 ] && [ $code -ne 5 ]; then exit $code; fi
      - name: coverage gate
        shell: bash   # -eo pipefail, so the pytest exit status survives the pipe into tee
        run: |
          min=$(awk '/^coverage_min:/ {print $2*100}' ci/gates.yaml)
          uv run --no-sync pytest -n auto -m "not slow and not calibration_full and not e2e" \
            --cov=giap --cov-report=term-missing:skip-covered --cov-report=xml \
            --cov-fail-under="$min" | tee coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  nf-test-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: nf-test in stub mode
        run: |
          if ! ls workflow/tests/*.nf.test >/dev/null 2>&1; then echo "no nf-test suites yet"; exit 0; fi
          curl -fsSL https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
          curl -fsSL https://get.nf-test.com | bash -s 0.9.5 && sudo mv nf-test /usr/local/bin/
          nf-test test workflow/tests --profile test,stub

  summary:
    if: always() && github.event_name == 'pull_request'
    needs: [lint, guards, test, calibration-and-coverage, nf-test-stub]
    runs-on: ubuntu-latest
    steps:
      - name: post result summary as a PR comment (§3.10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="**CI summary** for ${{ github.event.pull_request.head.sha }}
          | job | result |
          |---|---|
          | lint | ${{ needs.lint.result }} |
          | guards | ${{ needs.guards.result }} |
          | tests | ${{ needs.test.result }} |
          | calibration + coverage | ${{ needs.calibration-and-coverage.result }} |
          | nf-test stub | ${{ needs.nf-test-stub.result }} |"
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$body"
