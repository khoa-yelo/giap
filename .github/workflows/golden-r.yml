# Regenerate the R golden references (M8-12; GIAP_SPEC.md §11.5, §12). Manual only. The env is
# installed from the explicit lock (conda-forge and bioconda only); the result is proposed as a
# pull request on a separate branch and never pushed to main. FarmShare route:
# scripts/slurm/golden_r.sbatch.
name: golden-r

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "why the golden data are regenerated (a package upgrade needs an ADR)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: scripts/golden/golden_r.explicit.txt
          environment-name: giap-golden-r
      - name: inputs and R outputs (each twice; byte-identical)
        env:
          REASON: ${{ inputs.reason }}
        run: |
          seed=$(uv run --no-sync python -c 'import yaml; print(yaml.safe_load(open("tests/calibration/tolerances.yaml"))["seeds"]["GOLDEN_SEED"])')
          dest=tests/data/golden/r
          lock=scripts/golden/golden_r.explicit.txt
          for i in 1 2; do
            uv run --no-sync python scripts/golden/make_golden_inputs.py --out "$RUNNER_TEMP/in$i" --seed "$seed"
            micromamba run -n giap-golden-r Rscript --vanilla scripts/golden/make_golden_r.R \
              "$RUNNER_TEMP/in1" "$RUNNER_TEMP/out$i" "$RUNNER_TEMP/VERSIONS$i.txt" "$lock" "$seed"
          done
          diff -r "$RUNNER_TEMP/in1" "$RUNNER_TEMP/in2"
          diff -r "$RUNNER_TEMP/out1" "$RUNNER_TEMP/out2"
          rm -rf "$dest/inputs" "$dest/outputs"
          mkdir -p "$dest"
          cp -r "$RUNNER_TEMP/in1" "$dest/inputs"
          cp -r "$RUNNER_TEMP/out1" "$dest/outputs"
          cp "$RUNNER_TEMP/VERSIONS1.txt" "$dest/VERSIONS.txt"
          cat > "$dest/PROVENANCE.md" <<MD
          # R golden references: fgsea and goseq (M8-12; GIAP_SPEC.md §11.4, §11.5)

          - Command: workflow \`golden-r.yml\` (\`make_golden_inputs.py --seed $seed\`, \`make_golden_r.R\`).
          - Job: GitHub Actions run ${GITHUB_RUN_ID} on $(hostname), $(date -u +%Y-%m-%d).
          - Env lock: \`$lock\`, sha256 \`$(sha256sum "$lock" | cut -d' ' -f1)\`.
          - Scripts: git commit \`${GITHUB_SHA}\`.
          - Seed: GOLDEN_SEED = $seed; inputs and outputs generated twice, byte-identical.
          - Reason: ${REASON}
          MD
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: golden-r/regenerate-${{ github.run_id }}
          base: ${{ github.ref_name }}
          title: "chore(golden): regenerate the R golden references"
          body: "Regenerated by golden-r.yml (run ${{ github.run_id }}). Reason: ${{ inputs.reason }}"
          commit-message: "chore(golden): regenerate the R golden references"
          add-paths: tests/data/golden/r
