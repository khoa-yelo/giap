# The MkDocs site (M11-07): a strict build on every push to main that touches the docs or their
# generated sources, uploaded as a Pages artefact. The deploy job runs only once Khoa enables Pages
# and sets the repository variable PAGES_ENABLED=true (Q-K9). Only GitHub's own actions/* are used
# (tags, as in ci.yml; Q-L5), so there is no third-party action to pin.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/giap/cli.py"
      - "src/giap/config/**"
      - "src/giap/schemas/**"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv comes from PyPI, not astral-sh/setup-uv, so this workflow has no third-party action to
      # SHA-pin (Q-L5). It is pinned so the docs build is reproducible; ci.yml's setup-uv@v6 takes
      # the latest uv instead, so the two can differ (both read the same uv.lock with --frozen).
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --frozen --extra docs
      - name: generated references are current
        run: uv run --no-sync python scripts/docs/gen_reference.py --check
      - name: strict build
        run: uv run --no-sync mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
