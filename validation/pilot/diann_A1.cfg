# DIA-NN settings for pilot arm A1 (GIAP_SPEC.md §15.1: generic reference proteome).
# One flag per line; `$VAR`/`${VAR}` are expanded by scripts/slurm/diann_pilot.sbatch.
# [step1] predicts the in-silico library from the FASTA files (no raw files; M3-24 decision 4),
# [step2] searches the runs against that library. --f, --lib, --out, --out-lib and --threads are
# supplied by the sbatch script. A1 and A2 differ only in --fasta.
# The digest flags are GIAP's own digest (src/giap/mapping/digest.py, M3-22; decision 5).

[step1]
--fasta-search
--gen-spec-lib
--predictor
--fasta $GIAP_DATA_DIR/proteomes/UP000000625.fasta
--fasta $GIAP_DB_DIR/contaminants/contaminants.fasta
--cut K*,R*
--missed-cleavages 1
--min-pep-len 7
--max-pep-len 30
--unimod4
--var-mods 1
--var-mod UniMod:35,15.994915,M
--min-pr-charge 1
--max-pr-charge 4
--min-pr-mz 300
--max-pr-mz 1800
--min-fr-mz 200
--max-fr-mz 1800
--peptidoforms
--verbose 1

[step2]
--fasta $GIAP_DATA_DIR/proteomes/UP000000625.fasta
--fasta $GIAP_DB_DIR/contaminants/contaminants.fasta
--gen-spec-lib
--qvalue 0.01
--report-decoys
--matrices
--peptidoforms
--verbose 1
