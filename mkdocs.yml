# MkDocs site (M11-07). Build: mkdocs build --strict. The reference pages and the methods and ADR
# indexes are generated by scripts/docs/gen_reference.py (CI checks they are current).
site_name: GIAP
site_description: Genome-integrated analysis of proteomics data for bacterial genomes
docs_dir: docs

theme:
  name: material
  font: false            # no Google Fonts request
  features:
    - navigation.sections

# Q-L6: ADRs are in the site, specs and the backlog are not.
exclude_docs: |
  /specs/
  /backlog.md

# Strict builds turn these warnings into errors; unrecognized_links catches link-shaped text such
# as an interval followed by a parenthesis (M11-07 example 5).
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:      # Changelog and Citation embed files from the repository root
      base_path: [!relative $config_dir]
      check_paths: true

# Q-L7: MathJax 3 from jsDelivr, the only third-party host of the site.
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

